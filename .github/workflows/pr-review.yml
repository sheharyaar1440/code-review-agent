name: AI PR Review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ollama gitpython

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh || { echo "Ollama install failed"; exit 1; }
          if lsof -i :11434; then
            echo "Port 11434 in use, attempting to free it..."
            kill -9 $(lsof -t -i :11434) || { echo "Failed to kill process on port 11434"; exit 1; }
          fi
          ollama serve &
          sleep 90
          curl -sSf http://127.0.0.1:11434 || { echo "Ollama server not running"; exit 1; }

      - name: Pull Code Llama Model
        run: |
          ollama pull codellama:7b-instruct || { echo "Model pull failed"; exit 1; }

      - name: Get PR Diff
        id: pr_diff
        run: |
          echo "Fetching PR diff..."
          git fetch origin main
          DIFF=$(git diff origin/main...HEAD)
          echo "PR_DIFF<<EOF" >> $GITHUB_ENV
          echo "$DIFF" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "Diff size: $(echo "$DIFF" | wc -l) lines"

      - name: Debug PR Diff
        run: |
          echo "PR_DIFF content (first 30 lines):"
          echo "$PR_DIFF" | head -n 30

      - name: Run Code Review
        run: python review_pr.py --github
        timeout-minutes: 5
        env:
          PR_DIFF: ${{ env.PR_DIFF }}

      - name: Debug Review Content
        run: |
          echo "Review content:"
          if [ -f review.json ]; then
            echo "review.json exists, size: $(wc -c < review.json) bytes"
            echo "First 50 lines of review.json:"
            head -n 50 review.json
            echo "JSON structure check:"
            python -c "import json; data=json.load(open('review.json')); print(f'Valid JSON with {len(data)} items')" || echo "Invalid JSON"
          else
            echo "No review.json found"
            ls -la
          fi

      - name: Post Inline Review Comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;
            const headSha = context.payload.pull_request.head.sha;

            let review;
            try {
              review = JSON.parse(fs.readFileSync(path.join(process.cwd(), 'review.json'), 'utf8'));
            } catch (e) {
              core.warning(`Failed to parse review.json: ${e.message}`);
              review = [];
            }

            if (!Array.isArray(review)) {
              core.warning('review.json is not an array; skipping inline comments');
              review = [];
            }

            const { data: files } = await github.rest.pulls.listFiles({ owner, repo, pull_number, per_page: 100 });
            const isReviewable = (p) => {
              if (!p) return false;
              const excludedPrefixes = ['.github/','.husky/','scripts/','config/','node_modules/','public/','__tests__/','.vscode/','.idea/','.git/'];
              if (excludedPrefixes.some(pre => p.startsWith(pre))) return false;
              const allowedExts = ['.js','.jsx','.ts','.tsx','.mjs','.cjs','.vue','.svelte','.py','.rb','.php','.go','.rs','.java','.kt','.kts','.scala','.cs','.cshtml','.vb','.fs','.swift','.c','.cc','.cxx','.cpp','.h','.hpp','.hh','.m','.mm','.sql','.ps1','.sh'];
              return allowedExts.some(ext => p.endsWith(ext));
            };
            const changed = new Set(files.map(f => f.filename).filter(isReviewable));
            console.log(`Found ${changed.size} reviewable files: ${Array.from(changed).join(', ')}`);

            let posted = 0;
            let failed = 0;

            for (const item of review) {
              const file = item.file;
              const line = Number(item.line);
              const snippet = item.snippet || "";
              let body = (item.comment || "").trim();
              
              // Add diff context if available
              if (snippet) {
                body = `**Code Context:**\n\`\`\`diff\n${snippet}\n\`\`\`\n\n${body}`;
              }

              console.log(`Processing review item: ${file}:${line}`);
              
              if (!file) {
                console.log(`Skipping item: no file specified`);
                continue;
              }
              
              if (!changed.has(file)) {
                console.log(`Skipping ${file}: not in changed files`);
                continue;
              }
              
              if (!Number.isInteger(line) || line <= 0) {
                console.log(`Skipping ${file}:${line}: invalid line number`);
                continue;
              }
              
              if (!body) {
                console.log(`Skipping ${file}:${line}: empty comment`);
                continue;
              }

              try {
                await github.rest.pulls.createReviewComment({
                  owner,
                  repo,
                  pull_number,
                  commit_id: headSha,
                  path: file,
                  line,
                  side: 'RIGHT',
                  body
                });
                posted++;
                console.log(`Successfully posted comment for ${file}:${line}`);
              } catch (e) {
                failed++;
                console.error(`Failed to post inline comment for ${file}:${line} - ${e.message}`);
                core.warning(`Failed to post inline comment for ${file}:${line} - ${e.message}`);
              }
            }
            core.info(`Posted ${posted} inline review comments, ${failed} failed.`);

      - name: Post Review Summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let body = '';
            try {
              const review = JSON.parse(fs.readFileSync(path.join(process.cwd(), 'review.json'), 'utf8'));
              if (Array.isArray(review) && review.length > 0) {
                body += '### AI Review Findings\n\n';
                for (const item of review) {
                  const file = item.file || 'UNKNOWN';
                  const line = item.line || 1;
                  const comment = (item.comment || '').replace(/```diff\n[\s\S]*?\n```/, '').replace('\n\n**Resolve:** Mark as resolved in GitHub UI', '').trim();
                  body += `- ${file}:${line} - ${comment}\n`;
                }
              } else {
                body = 'No actionable AI review comments found.';
              }
            } catch (e) {
              core.warning(`AI review failed to produce valid JSON: ${e.message}`);
              body = `AI review failed to produce valid JSON: ${e.message}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
